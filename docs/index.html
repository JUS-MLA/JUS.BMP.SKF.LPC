<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS Official</title>
<style>
  body{
    margin:0; 
    min-height:100vh; 
    background: url('received_17669851117943310.jpeg') no-repeat center center;
    background-size: cover;
    background-color:#020a18;
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-family:Arial;
  }
  .login-box{
    background:rgba(0,0,0,0.8); 
    padding:20px; 
    border-radius:15px; 
    border:1px solid #00c6ff; 
    width:280px; 
    text-align:center; 
    box-shadow:0 0 25px rgba(0,198,255,0.5);
  }
  .login-box h2{color:#00c6ff; letter-spacing:2px; margin-top:0;}
  .login-box input{width:90%; padding:11px; margin:6px; border-radius:8px; border:1px solid #00c6ff; background:rgba(0,0,0,0.6); color:#fff; outline:none;}
  .login-box button{width:95%; padding:11px; margin-top:10px; border:none; border-radius:8px; background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff; font-weight:bold; cursor:pointer;}
  #msg{color:#ff4d4d; font-size:12px; display:none; margin-top:10px;}
</style>
</head>
<body>

<div class="login-box">
<h2>JUS LOGIN</h2>
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="msg">Wrong Username or Password!</p>
</div>

<script>
function login(){
  var u = document.getElementById("user").value;
  var p = document.getElementById("pass").value;
  if(u === "JUS" && p === "JUS123"){
    alert("Login Success!");
  }else{
    document.getElementById("msg").style.display="block";
  }
}
</script>

</body>
</html>
