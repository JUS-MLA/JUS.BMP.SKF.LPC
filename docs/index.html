<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS Official</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0e2a;position:relative;overflow:hidden;padding:15px}
body::before{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,#5b4dff 0%,#2a1a8a 60%);border-radius:50%;left:-80px;top:30%;opacity:.6;filter:blur(10px)}
body::after{content:'';position:absolute;width:650px;height:650px;background:radial-gradient(circle,#8b5cf6 0%,#4c1d95 70%);border-radius:50%;right:-150px;top:15%;opacity:.7;filter:blur(5px)}
.login-box{width:365px;position:relative;z-index:2;background:rgba(255,255,255,.13);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.25);border-radius:28px;padding:22px;box-shadow:0 0 50px rgba(100,80,255,.5);text-align:center}
.login-box h2{color:#fff;letter-spacing:3px;margin:0 0 4px;font-size:28px}
.wel{color:#c7c2ff;font-size:13px;margin-bottom:16px}
.login-box input{width:90%;padding:11px 12px;margin:6px 0;border-radius:30px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;outline:none}
.login-box input::placeholder{color:#ddd8ff;font-size:13px}
.pass-wrap{position:relative;width:90%;margin:6px auto}.pass-wrap input{width:100%;margin:0}.pass-wrap span{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer}
.main-btn{width:90%;padding:12px;margin-top:12px;border:none;border-radius:30px;background:linear-gradient(90deg,#5b7bff,#c084fc);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 5px 20px rgba(120,100,255,.6)}
.save-box{width:90%;margin:10px auto;text-align:left;color:#e0d8ff;font-size:13px}.save-box input{width:auto}
.links{width:90%;margin:12px auto 0;display:flex;justify-content:space-between;font-size:12px}.links a{color:#7dd3fc;cursor:pointer;text-decoration:underline}
#msg{font-size:12px;margin-top:10px;color:#fde68a}#autoMsg{font-size:11px;color:#00ff88;margin-top:6px}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999}
.popup-box{background:#1e1b4b;border:1px solid #7c3aed;padding:20px;border-radius:16px;width:300px;text-align:center}
.popup-box h3{color:#fff;margin:0 0 10px}.popup-box input{width:90%;padding:10px;margin:6px 0;border-radius:20px;border:1px solid #555;background:#0f0a2a;color:#fff}
.popup-box button{width:90%;padding:10px;margin-top:8px;border:none;border-radius:20px;background:linear-gradient(90deg,#5b7bff,#c084fc);color:#fff;font-weight:bold}
.close{color:#aaa;cursor:pointer;font-size:12px;margin-top:10px;display:block}
</style>
</head>
<body>
<div class="login-box">
<h2>JUS</h2>
<div class="wel">Welcome your Organization</div>

<input type="text" id="orgName" placeholder="Organization Name">
<input type="text" id="userID" placeholder="Organization User ID">
<input type="text" id="bso" placeholder="Branch Shop & Others">
<input type="text" id="mobile" placeholder="Mobile Number" oninput="autoFind()">
<div class="pass-wrap"><input type="password" id="pass" placeholder="Password"><span onclick="togglePass()">👁️</span></div>

<div class="save-box"><label><input type="checkbox" id="autoSave" checked> Auto Save Data</label></div>
<button class="main-btn" onclick="login()">LOGIN</button>
<button class="main-btn" onclick="adminFastLogin()" style="background:transparent;border:1px solid #00ff88;color:#00ff88;box-shadow:none">⚡ ADMIN FAST LOGIN</button>

<div class="links"><a onclick="openPopup('forgot')">Forgot Password?</a><a onclick="openPopup('change')">Change Password</a></div>
<p id="msg"></p><p id="autoMsg"></p>
</div>

<div class="popup" id="forgotPopup"><div class="popup-box"><h3>Forgot Password</h3><input id="fMobile" placeholder="Mobile Number"><input id="fNewPass" placeholder="New Password"><button onclick="forgotPass()">Reset</button><span class="close" onclick="closePopup()">Close</span><p id="fMsg"></p></div></div>
<div class="popup" id="changePopup"><div class="popup-box"><h3>Change Password</h3><input id="cOld" placeholder="Old Password" type="password"><input id="cNew" placeholder="New Password" type="password"><button onclick="changePass()">Update</button><span class="close" onclick="closePopup()">Close</span><p id="cMsg"></p></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2lEhqt_90knN7xERpQN9GZ4U_uuUnJs",
  authDomain: "jus-bmp-skf.firebaseapp.com",
  databaseURL: "https://jus-bmp-skf-default-rtdb.firebaseio.com",
  projectId: "jus-bmp-skf",
  storageBucket: "jus-bmp-skf.firebasestorage.app",
  messagingSenderId: "763512076096",
  appId: "1:763512076096:web:3e5f79cc274b34d8106ca5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allOrgs = [];
let orgPaths = {}; // orgID -> firebase path

// Firebase থেকে সব Data Load
onValue(ref(db,'jus/categories'), (s)=>{
  const d=s.val()||{};
  allOrgs=[];
  orgPaths={};
  Object.keys(d).forEach(cat=>{
    Object.keys(d[cat]||{}).forEach(orgKey=>{
      const org = d[cat][orgKey];
      allOrgs.push(org);
      if(org.orgID) orgPaths[org.orgID] = `jus/categories/${cat}/${orgKey}`;
    });
  });
  console.log("Firebase Loaded:", allOrgs.length);
});

window.togglePass = ()=>{ const p=document.getElementById('pass'); p.type=p.type==="password"?"text":"password"; }
window.openPopup = (t)=>{ document.getElementById(t==='forgot'?'forgotPopup':'changePopup').style.display="flex"; }
window.closePopup = ()=>{ document.getElementById('forgotPopup').style.display="none"; document.getElementById('changePopup').style.display="none"; }

window.autoFind = ()=>{
  const m=document.getElementById('mobile').value.trim();
  const autoMsg=document.getElementById('autoMsg');
  if(m.length<5){autoMsg.style.display="none";return;}
  const f=allOrgs.find(o=>o.mobile && o.mobile.includes(m));
  if(f){
    document.getElementById('orgName').value=f.orgName||"";
    document.getElementById('userID').value=f.orgID||"";
    document.getElementById('bso').value=(f.branchName||"")+" "+(f.branchTitle||"");
    document.getElementById('pass').value=f.password||"";
    autoMsg.style.display="block";
    autoMsg.innerText="✅ Firebase Found: "+f.orgID;
  }
}

window.adminFastLogin = ()=>{
  localStorage.setItem("jus_login","true");
  localStorage.setItem("jus_orgName","JUS Official");
  localStorage.setItem("jus_userID","ADMIN");
  localStorage.setItem("jus_org",JSON.stringify({orgID:"ADMIN",orgName:"JUS Official"}));
  location.href="dashboard.html";
}

window.login = async ()=>{
  const id=document.getElementById('userID').value.trim();
  const pass=document.getElementById('pass').value.trim();
  const msg=document.getElementById('msg');
  if(!id||!pass){msg.innerText="ID & Password দাও";return;}
  msg.innerText="Checking Firebase...";

  if(id==="ADMIN" && (pass==="ADMIN123" || pass==="JUS123")){
    adminFastLogin(); return;
  }

  const found = allOrgs.find(o=>o.orgID==id);
  if(!found){msg.innerText="❌ ID "+id+" Firebase এ পাওয়া যায়নি!";return;}
  if(found.password!=pass && found.branchPassword!=pass){msg.innerText="❌ Password ভুল!";return;}

  localStorage.setItem("jus_login","true");
  localStorage.setItem("jus_orgName",found.orgName||"");
  localStorage.setItem("jus_userID",found.orgID);
  localStorage.setItem("jus_mobile",found.mobile||"");
  localStorage.setItem("jus_org",JSON.stringify(found));
  msg.innerText="✅ Login Success!";
  setTimeout(()=>location.href="dashboard.html",600);
}

window.forgotPass = async ()=>{
  const mob=document.getElementById('fMobile').value.trim();
  const np=document.getElementById('fNewPass').value.trim();
  const fMsg=document.getElementById('fMsg');
  if(!mob||!np){fMsg.innerText="Fill all";return;}
  const f=allOrgs.find(o=>o.mobile && o.mobile.includes(mob));
  if(!f){fMsg.innerText="Mobile পাওয়া যায়নি";return;}
  const path=orgPaths[f.orgID];
  await update(ref(db,path),{password:np,branchPassword:np});
  fMsg.style.color="#00ff88";fMsg.innerText="✅ Password Reset Done!";setTimeout(()=>closePopup(),1500);
}

window.changePass = async ()=>{
  const id=document.getElementById('userID').value.trim();
  const oldP=document.getElementById('cOld').value.trim();
  const newP=document.getElementById('cNew').value.trim();
  const cMsg=document.getElementById('cMsg');
  const f=allOrgs.find(o=>o.orgID==id);
  if(!f){cMsg.innerText="ID নাই";return;}
  if(f.password!=oldP){cMsg.innerText="Old Password ভুল";return;}
  const path=orgPaths[f.orgID];
  await update(ref(db,path),{password:newP,branchPassword:newP});
  cMsg.style.color="#00ff88";cMsg.innerText="✅ Changed!";setTimeout(()=>closePopup(),1500);
}
</script>
</body>
</html>
