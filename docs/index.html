<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS - Official Docs</title>
<style>
  body{margin:0; background:#020d1f; color:white; font-family:sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; background-image: radial-gradient(rgba(0,180,255,0.15) 1px, transparent 1px); background-size:30px 30px;}
  .container{text-align:center; padding:20px;}
  .logo-box{background:white; padding:15px 35px; border-radius:18px; display:inline-block; margin-bottom:25px;}
  .logo-box span{color:#003366; font-weight:900; font-size:28px;}
  h1{font-size:90px; margin:0; background:linear-gradient(to bottom, #5ee7ff, #0090ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:900;}
  .btn{background:white; color:#002244; padding:14px 45px; border-radius:30px; font-weight:bold; display:inline-block; margin-top:25px; letter-spacing:1px;}
  .cards{display:flex; gap:18px; margin-top:45px; justify-content:center; flex-wrap:wrap;}
  .card{background:rgba(255,255,255,0.08); border:1px solid rgba(0,180,255,0.3); backdrop-filter:blur(12px); padding:25px 20px; border-radius:16px; width:160px;}
  .card b{display:block; margin-top:15px; font-size:16px;}
  .card small{opacity:0.7; font-size:12px; display:block; margin-top:8px;}
</style>
</head>
<body>
<div class="container">
  <div class="logo-box"><span>🌐 JUS</span></div>
  <h1>JUS</h1>
  <div class="btn">CONTACT BD</div>
  <div class="cards">
    <div class="card">🛡️<b>100% Trusted</b><small>Verified & reliable business solutions</small></div>
    <div class="card">🎧<b>24/7 Support</b><small>Round-the-clock dedicated support team</small></div>
    <div class="card">🌍<b>Global Business</b><small>Serving clients worldwide across regions</small></div>
  </div>
</div>
</body>
</html>
