<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS Official</title>
<style>
  body{margin:0; background:#020a18; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:Arial;}
  img{width:100%; height:auto; display:block;}
  .login-box{position:fixed; bottom:25px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.85); padding:15px; border-radius:15px; border:1px solid #00c6ff; width:280px; text-align:center; box-shadow:0 0 20px rgba(0,198,255,0.4);}
  .login-box input{width:90%; padding:10px; margin:5px; border-radius:8px; border:1px solid #00c6ff; background:#000; color:#fff; outline:none;}
  .login-box button{width:95%; padding:10px; margin-top:8px; border:none; border-radius:8px; background:linear-gradient(90deg,#00c6ff,#0072ff); color:#fff; font-weight:bold; cursor:pointer;}
  #msg{color:#ff4d4d; font-size:12px; display:none; margin-top:8px;}
</style>
</head>
<body>
<img src="received_17669851117943310.jpeg" alt="JUS Banner">

<div class="login-box">
<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="msg">Wrong Username or Password!</p>
</div>

<script>
function login(){
  var u = document.getElementById("user").value;
  var p = document.getElementById("pass").value;
  if(u === "JUS" && p === "JUS123"){
    alert("Login Success!");
    window.location.href = "login.html";
  }else{
    document.getElementById("msg").style.display = "block";
  }
}
</script>

</body>
</html>
