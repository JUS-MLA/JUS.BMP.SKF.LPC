<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS Dashboard</title>
<style>
body{margin:0;background:#020a18;color:#fff;font-family:Arial;min-height:100vh;}
.header{background:rgba(0,0,0,0.8);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00c6ff;box-shadow:0 0 15px rgba(0,198,255,0.3);}
.header h2{margin:0;color:#00c6ff;letter-spacing:1px;}
.header button{background:#ff3b3b;border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:bold;}
.container{padding:20px;max-width:900px;margin:auto;}
.card{background:rgba(0,0,0,0.6);border:1px solid #00c6ff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 0 20px rgba(0,198,255,0.2);}
.card h3{margin-top:0;color:#00c6ff;}
.info p{margin:8px 0;color:#ccc;}
.info span{color:#fff;font-weight:bold;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px;}
.grid .box{background:linear-gradient(135deg,#00c6ff,#0072ff);padding:20px;border-radius:12px;text-align:center;font-weight:bold;font-size:18px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="header">
<h2>JUS OFFICIAL - DASHBOARD</h2>
<button onclick="logout()">LOGOUT</button>
</div>

<div class="container">
<div class="card">
<h3>Organization Info</h3>
<div class="info">
<p>Organization Name: <span id="dName"></span></p>
<p>Organization ID: <span id="dID"></span></p>
<p>Mobile Number: <span id="dMobile"></span></p>
<p>Login Status: <span style="color:#00ff88">Active ✅</span></p>
</div>
</div>

<div class="grid">
<div class="box">Total Members<br>0</div>
<div class="box">Total Collection<br>৳ 0</div>
<div class="box">Notice<br>0</div>
<div class="box">Reports<br>View</div>
</div>
</div>

<script>
// Check Login
if(localStorage.getItem("jus_login") !== "true"){
  window.location.href="index.html";
}
document.getElementById("dName").innerText = localStorage.getItem("jus_orgName") || "N/A";
document.getElementById("dID").innerText = localStorage.getItem("jus_orgID") || "N/A";
document.getElementById("dMobile").innerText = localStorage.getItem("jus_mobile") || "N/A";

function logout(){
  localStorage.removeItem("jus_login");
  window.location.href="index.html";
}
</script>
</body>
</html>
