<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JUS Dashboard</title>
<style>
body{margin:0;background:#f2f3f8;font-family:Arial;padding:8px;padding-bottom:85px;}
.top{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:10px;}
.top-box{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.05);}
.top-box.ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;margin:0 auto 3px;}
.top-box b{font-size:13px;display:block;}
.top-box span{font-size:10px;color:#666;}
.cat-head{font-weight:bold;font-size:13px;margin:8px 3px;}
.cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px;}
.cbox{background:#fff;border-radius:12px;padding:10px 5px;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,0.05);}
.cbox.ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;margin:0 auto 4px;}
.cbox span{font-size:10px;}
.cbox b{font-size:10px;}
.form{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.form b{font-size:12px;}
.form input,.form select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none;background:#f0f1f5;outline:none;box-sizing:border-box;font-size:11px;}
.id-row{display:flex;gap:6px;margin-top:5px;}
.id-row select{flex:1.3;font-size:11px;}
.id-row div{flex:0.7;background:#eaf1ff;border:1px solid #5b8cff;color:#2f5bff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;}
.save{width:100%;background:#2f5bff;color:#fff;padding:11px;border:none;border-radius:10px;font-weight:bold;margin-top:8px;cursor:pointer;font-size:12px;}
.gen{color:#16a34a;font-size:10px;text-align:center;margin-top:6px;font-weight:bold;}
.nav{position:fixed;bottom:10px;left:10px;right:10px;background:#fff;border-radius:20px;display:flex;justify-content:space-around;align-items:center;padding:8px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.nav.plus{width:32px;height:32px;background:#2f5bff;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.nav span{font-size:10px;}
</style>
</head>
<body>

<!-- NEW DASHBOARD STATS - ছোট Size -->
<div class="top">
<div class="top-box"><div class="ic" style="background:#fef3c7;">🏢</div><span>Total Org</span><b id="totalOrg">0</b></div>
<div class="top-box"><div class="ic" style="background:#dcfce7;">✅</div><span>Active Org</span><b id="activeOrg">0</b></div>
<div class="top-box"><div class="ic" style="background:#fee2e2;">❌</div><span>Drop Org</span><b id="dropOrg">0</b></div>
<div class="top-box"><div class="ic" style="background:#e0e7ff;">👥</div><span>All Member</span><b id="allMember">0</b></div>
</div>

<div class="cat-head">Categories</div>
<div class="cats">
<div class="cbox"><div class="ic" style="background:#e6f0ff;">$</div><span>Finance <b id="c1">0</b></span></div>
<div class="cbox"><div class="ic" style="background:#e3f8e3;">🌱</div><span>Agriculture <b id="c2">0</b></span></div>
<div class="cbox"><div class="ic" style="background:#fff1dc;">🛍️</div><span>Shop <b id="c3">0</b></span></div>
<div class="cbox"><div class="ic" style="background:#eef0ff;">✈️</div><span>Travels <b id="c4">0</b></span></div>
<div class="cbox"><div class="ic" style="background:#f0f0f0;">•••</div><span>Others <b id="c5">0</b></span></div>
<div class="cbox"><div class="ic" style="background:#fef3c7;">📦</div><span>Sale ৳0</span></div>
</div>

<div class="form">
<b>+ Add New Organization</b>
<input id="orgName" placeholder="AFROJA AGRO" oninput="makeID()">
<input id="bName" placeholder="Branch Name (ex: Rajshahi Sadar)">
<input id="bTitle" placeholder="Branch Title (ex: Main Branch)">
<input id="mob" placeholder="Mobile Number">
<input id="pass" placeholder="Branch Login Password">
<div class="id-row">
<select id="cat">
<option value="Branch Finance">Branch Finance</option>
<option value="Branch Agriculture" selected>Branch Agriculture</option>
<option value="Branch Shop">Branch Shop</option>
<option value="Branch Travels">Branch Travels</option>
<option value="Branch Others">Branch Others</option>
</select>
<div id="orgID">01</div>
</div>
<button class="save" onclick="save()">Save to Firebase</button>
<div class="gen" id="genText">✅ Auto: 01 থেকে শুধু সংখ্যা</div>
</div>

<div class="nav">
<div style="text-align:center;color:#2f5bff;"><span>🏠<br>Home</span></div>
<div style="text-align:center;color:#888;"><span>📊<br>Analytics</span></div>
<div class="plus">+</div>
<div style="text-align:center;"><span>🔔<br></span></div>
<div style="text-align:center;"><span>👤<br></span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyD2lEhqt_90knN7xERpQN9GZ4U_uuUnJs", authDomain: "jus-bmp-skf.firebaseapp.com", databaseURL: "https://jus-bmp-skf-default-rtdb.firebaseio.com", projectId: "jus-bmp-skf", storageBucket: "jus-bmp-skf.firebasestorage.app", messagingSenderId: "763512076096", appId: "1:763512076096:web:3e5f79cc274b34d8106ca5" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let total=0;
onValue(ref(db,'jus/categories'), s=>{
  const data=s.val()||{};
  let t=0, active=0, allMem=0;
  let counts={"Branch Finance":0,"Branch Agriculture":0,"Branch Shop":0,"Branch Travels":0,"Branch Others":0};
  Object.keys(data).forEach(cat=>{
    Object.values(data[cat]||{}).forEach(org=>{
      t++;
      allMem++;
      if(org.status!=="drop") active++;
      if(counts[cat]!==undefined) counts[cat]++;
    });
  });
  total=t;
  document.getElementById('totalOrg').innerText=t;
  document.getElementById('activeOrg').innerText=active;
  document.getElementById('dropOrg').innerText=t-active;
  document.getElementById('allMember').innerText=allMem;
  document.getElementById('c1').innerText=counts["Branch Finance"];
  document.getElementById('c2').innerText=counts["Branch Agriculture"];
  document.getElementById('c3').innerText=counts["Branch Shop"];
  document.getElementById('c4').innerText=counts["Branch Travels"];
  document.getElementById('c5').innerText=counts["Branch Others"];
  makeID();
});

window.makeID=()=>{
  let next = total + 1;
  if(next<1) next=1;
  let id = next < 10? "0"+next : String(next);
  document.getElementById('orgID').innerText=id;
  document.getElementById('genText').innerText="✅ Auto: "+id+" (01 থেকে শুধু সংখ্যা)";
}

window.save=()=>{
  const orgName=document.getElementById('orgName').value.trim();
  const bName=document.getElementById('bName').value.trim();
  const bTitle=document.getElementById('bTitle').value.trim();
  const mob=document.getElementById('mob').value.trim();
  const pass=document.getElementById('pass').value.trim();
  const cat=document.getElementById('cat').value;
  const orgID=document.getElementById('orgID').innerText;
  if(!orgName||!bName||!bTitle||!mob||!pass) return alert("Sob Field Fill Koro!");
  const data={orgName,branchName:bName,branchTitle:bTitle,mobile:mob,password:pass,orgID,category:cat,status:"active",createdAt:Date.now()};
  set(ref(db,'jus/categories/'+cat+'/'+orgID), data).then(()=>{
    alert("✅ Saved! ID: "+orgID);
    orgName.value="";bName.value="";bTitle.value="";mob.value="";pass.value="";
    document.getElementById('orgName').value="";document.getElementById('bName').value="";document.getElementById('bTitle').value="";document.getElementById('mob').value="";document.getElementById('pass').value="";
  });
}
</script>
</body>
</html>
