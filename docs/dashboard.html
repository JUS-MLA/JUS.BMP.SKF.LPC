<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JUS Dashboard</title>
<style>
body{margin:0;background:#f5f5f7;font-family:Arial;padding:10px;padding-bottom:90px;}
.top{display:flex;justify-content:space-between;background:#fff;padding:12px;border-radius:15px;margin-bottom:12px;}
.top div{text-align:center;font-size:13px;font-weight:bold;}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.cbox{background:#fff;padding:18px;border-radius:15px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.cbox span{font-size:28px;display:block;}
.addbox{background:#fff;padding:15px;border-radius:15px;}
.addbox input,.addbox select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#f1f1f3;outline:none;box-sizing:border-box;}
.id-row{display:flex;gap:8px;align-items:center;}
.id-row select{flex:1;}
.id-row div{flex:0.7;background:#e8f0ff;border:1px solid #3b82f6;color:#3b82f6;padding:10px;border-radius:10px;font-weight:bold;font-size:15px;text-align:center;letter-spacing:2px;}
.saveBtn{width:100%;background:#2563eb;color:#fff;padding:13px;border:none;border-radius:12px;font-weight:bold;margin-top:8px;cursor:pointer;}
#genText{font-size:12px;color:#16a34a;text-align:center;margin-top:6px;font-weight:bold;}
.bottom{position:fixed;bottom:15px;left:10px;right:10px;background:#fff;display:flex;justify-content:space-around;padding:12px;border-radius:25px;box-shadow:0 5px 20px rgba(0,0,0,0.1);}
</style>
</head>
<body>

<div class="top">
<div>💰<br>Org<br><span id="totalOrg">0</span></div>
<div>📦<br>Sale<br>৳0</div>
<div>👥<br>Due<br>৳0</div>
</div>

<div style="font-weight:bold;margin:10px 5px;">Categories</div>
<div class="cat">
<div class="cbox"><span>💲</span>Branch Finance <b id="c1">0</b></div>
<div class="cbox"><span>🌱</span>Branch Agriculture <b id="c2">0</b></div>
<div class="cbox"><span>🛍️</span>Branch Shop <b id="c3">0</b></div>
<div class="cbox"><span>✈️</span>Branch Travels <b id="c4">0</b></div>
<div class="cbox"><span>...</span>Branch Others <b id="c5">0</b></div>
</div>

<div class="addbox">
<div style="font-weight:bold;margin-bottom:8px;">+ Add New Organization</div>
<input id="orgName" placeholder="Organization Name (ex: AFROJA AGRO)" oninput="autoGenID()">
<input id="branchName" placeholder="Branch Name (ex: Rajshahi Sadar)">
<input id="branchTitle" placeholder="Branch Title (ex: Main Branch)">
<input id="mobile" placeholder="Mobile Number">
<input id="password" placeholder="Branch Login Password">

<div class="id-row">
<select id="category">
<option value="Branch Finance">Branch Finance</option>
<option value="Branch Agriculture" selected>Branch Agriculture</option>
<option value="Branch Shop">Branch Shop</option>
<option value="Branch Travels">Branch Travels</option>
<option value="Branch Others">Branch Others</option>
</select>
<div id="orgID">01</div>
</div>

<button class="saveBtn" onclick="saveToFirebase()">Save to Firebase</button>
<div id="genText">✅ Auto Start From 01</div>
</div>

<div class="bottom">
<div>🏠 Home</div><div>Analytics</div><div style="background:#2563eb;color:#fff;width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;">+</div><div>🔔</div><div>👤</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyD2lEhqt_90knN7xERpQN9GZ4U_uuUnJs", authDomain: "jus-bmp-skf.firebaseapp.com", databaseURL: "https://jus-bmp-skf-default-rtdb.firebaseio.com", projectId: "jus-bmp-skf", storageBucket: "jus-bmp-skf.firebasestorage.app", messagingSenderId: "763512076096", appId: "1:763512076096:web:3e5f79cc274b34d8106ca5" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let totalCount = 0;
let allIDs=[];

onValue(ref(db,'jus/categories'), snap=>{
  const data=snap.val()||{};
  let total=0;
  let c={ "Branch Finance":0,"Branch Agriculture":0,"Branch Shop":0,"Branch Travels":0,"Branch Others":0 };
  allIDs=[];
  Object.keys(data).forEach(cat=>{
    const count = Object.keys(data[cat]||{}).length;
    if(c[cat]!==undefined) c[cat]=count;
    total+=count;
    Object.values(data[cat]||{}).forEach(v=>{ if(v.orgID) allIDs.push(v.orgID); });
  });
  totalCount = total;
  document.getElementById('totalOrg').innerText=total;
  document.getElementById('c1').innerText=c["Branch Finance"];
  document.getElementById('c2').innerText=c["Branch Agriculture"];
  document.getElementById('c3').innerText=c["Branch Shop"];
  document.getElementById('c4').innerText=c["Branch Travels"];
  document.getElementById('c5').innerText=c["Branch Others"];

  // Page load এ 01 থেকে Auto দেখাবে
  autoGenID();
});

// 01 থেকে Serial Digit - শুধু সংখ্যা
window.autoGenID=()=>{
  const org=document.getElementById('orgName').value.trim();
  // Org Name না লিখলেও 01 থেকে দেখাবে
  let nextID = totalCount + 1;
  if(nextID < 1) nextID = 1;

  let formattedID;
  if(nextID < 10){
    formattedID = "0" + nextID; // 01, 02, 03...
  } else if(nextID < 100){
    formattedID = String(nextID); // 10, 11...
  } else if(nextID < 1000){
    formattedID = String(nextID).padStart(3,'0'); // 100, 101...
  } else {
    formattedID = String(nextID).padStart(4,'0'); // 1000, 1001...
  }

  document.getElementById('orgID').innerText = formattedID;
  document.getElementById('genText').innerText = "✅ Auto ID: " + formattedID + " (01 থেকে শুরু)";
}

window.saveToFirebase=()=>{
  const orgName=document.getElementById('orgName').value.trim();
  const branchName=document.getElementById('branchName').value.trim();
  const branchTitle=document.getElementById('branchTitle').value.trim();
  const mobile=document.getElementById('mobile').value.trim();
  const password=document.getElementById('password').value.trim();
  const category=document.getElementById('category').value;
  const orgID=document.getElementById('orgID').innerText;
  if(!orgName||!branchName||!branchTitle||!mobile||!password) return alert("Sob Field Fill Koro!");
  const data={orgName,branchName,branchTitle,mobile,password,orgID,category,createdAt:Date.now()};
  set(ref(db,'jus/categories/'+category+'/'+orgID), data).then(()=>{
    alert("✅ Saved! ID: "+orgID);
    document.getElementById('orgName').value="";document.getElementById('branchName').value="";document.getElementById('branchTitle').value="";document.getElementById('mobile').value="";document.getElementById('password').value="";
  });
}
</script>
</body></html>
