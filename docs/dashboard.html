<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JUS Dashboard</title>
<style>
body{margin:0;background:#f0f2f8;font-family:Arial;padding:0 0 80px 0}
.top{padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card b{display:block;font-size:18px;margin-top:4px}
.card span{font-size:12px;color:#555}
.formBox{margin:10px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.formBox h3{margin:0 0 10px}
label{font-size:12px;color:#1e3a8a;font-weight:bold;margin:10px 0 4px;display:block}
input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#f3f4f6;outline:none;box-sizing:border-box}
.idRow{display:flex;gap:8px;align-items:center}
.idRow input{flex:1}
.badge{background:#1e40af;color:#fff;padding:12px 18px;border-radius:12px;font-weight:bold}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#1e40af;color:#fff;font-weight:bold;margin-top:12px;font-size:15px}
.botNav{position:fixed;bottom:10px;left:10px;right:10px;background:#fff;border-radius:20px;display:flex;justify-content:space-around;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.botNav span{font-size:13px}
.botNav .plus{background:#2563eb;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
</style></head><body>

<div class="top">
<div class="card">🏢<br><span>Total Org</span><b id="totalOrg">0</b></div>
<div class="card">✅<br><span>Active Org</span><b id="activeOrg">0</b></div>
<div class="card">🏬<br><span>Total Bra</span><b id="totalBra">0</b></div>
<div class="card">✔️<br><span>Active Bra</span><b id="activeBra">0</b></div>

<div class="card">❌<br><span>Reject Bra</span><b id="rejectBra">0</b></div>
<div class="card">🏪<br><span>Total Shop</span><b id="totalShop">0</b></div>
<div class="card">🛍️<br><span>Active Shop</span><b id="activeShop">0</b></div>
<div class="card">🗑️<br><span>Reject Shop</span><b id="rejectShop">0</b></div>

<div class="card">👥<br><span>All Member</span><b id="allMember">0</b></div>
<div class="card">👤<br><span>Active Member</span><b id="activeMember">0</b></div>
<div class="card">⬇️<br><span>Drop Member</span><b id="dropMember">0</b></div>
<div class="card">💰<br><span>Amount</span><b id="totalAmount">৳0</b></div>
</div>

<div class="formBox">
<h3>➕ Add New Organization</h3>
<label>Organization Name</label><input id="orgName" placeholder="Enter organization name">
<label>Branch Name</label><input id="branchName" placeholder="Enter branch name">
<label>Branch ID Auto Generate - 01</label>
<div class="idRow"><input id="orgUserID" placeholder="Auto-generated ID" readonly><div class="badge" id="branchID">01</div></div>
<div style="font-size:11px;color:#666;margin:4px 0" id="genText">Auto: 01 (0 ডেটা)</div>

<label>Branch Category</label>
<select id="cat"><option selected>Branch Agriculture</option><option>Branch Finance</option><option>Branch Shop</option><option>Branch Travels</option><option>Branch Others</option></select>

<label>Mobile Number</label><input id="mob" placeholder="+880 1XXX-XXXXXX">
<label>Password</label><input id="pass" type="password" placeholder="••••••••">

<div style="display:flex;gap:8px;margin-top:8px;font-size:12px"><label><input type="checkbox" id="autoSave" checked> Auto Save Data</label><label><input type="checkbox" id="saveFirebase" checked> Save to Firebase</label></div>

<button class="btn" onclick="saveData()">Save Organization</button>
</div>

<div class="botNav"><span>🏠 Home</span><span>📊 Analytics</span><div class="plus">+</div><span>👤</span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD2lEhqt_90knN7xERpQN9GZ4U_uuUnJs",authDomain:"jus-bmp-skf.firebaseapp.com",databaseURL:"https://jus-bmp-skf-default-rtdb.firebaseio.com",projectId:"jus-bmp-skf",storageBucket:"jus-bmp-skf.firebasestorage.app",messagingSenderId:"763512076096",appId:"1:763512076096:web:3e5f79cc274b34d8106ca5"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);

let totalCount=0;

// FIXED COUNTER - তুমি Drop করো নাই তাই Drop 0, Reject 0 থাকবে
onValue(ref(db,'jus/categories'), s=>{
  const data=s.val()||{};
  let total=0, active=0, reject=0, drop=0, shopTotal=0, shopActive=0, shopReject=0;
  
  Object.values(data).forEach((catObj, idx)=>{
    Object.values(catObj||{}).forEach(item=>{
      total++;
      const st=(item.status||'active').toLowerCase();
      const cat=(item.category||'').toLowerCase();
      if(st==='reject'){ reject++; if(cat.includes('shop')) shopReject++; }
      else if(st==='drop'){ drop++; }
      else { active++; if(cat.includes('shop')) shopActive++; }
      if(cat.includes('shop')) shopTotal++;
    });
  });

  totalCount=total;
  document.getElementById('totalOrg').innerText=total;
  document.getElementById('activeOrg').innerText=active;
  document.getElementById('totalBra').innerText=total;
  document.getElementById('activeBra').innerText=active;
  document.getElementById('rejectBra').innerText=reject;
  
  document.getElementById('totalShop').innerText=shopTotal;
  document.getElementById('activeShop').innerText=shopActive;
  document.getElementById('rejectShop').innerText=shopReject;
  
  document.getElementById('allMember').innerText=total;
  document.getElementById('activeMember').innerText=active;
  document.getElementById('dropMember').innerText=drop;
  document.getElementById('totalAmount').innerText="৳0";

  let id=total+1; id=id<10?"0"+id:id+"";
  document.getElementById('branchID').innerText=id;
  document.getElementById('orgUserID').value=id;
  document.getElementById('genText').innerText=`Auto: ${id} (${total} ডেটা সংরক্ষণ রয়েছে)`;
});

window.saveData=async()=>{
  const org=document.getElementById('orgName').value.trim();
  const bra=document.getElementById('branchName').value.trim();
  const cat=document.getElementById('cat').value;
  const mob=document.getElementById('mob').value.trim();
  const pas=document.getElementById('pass').value.trim();
  const id=document.getElementById('orgUserID').value.trim();
  if(!org||!bra||!mob||!pas) return alert("সব Field লাগবে!");
  
  const data={orgName:org, organizationName:org, branchName:bra, branchID:id, orgUserID:id, orgID:id, mobile:mob, mobileNumber:mob, password:pas, branchPassword:pas, category:cat, status:"active", createdAt:Date.now()};
  
  await set(ref(db,'jus/categories/'+cat+'/'+id), data);
  await set(ref(db,'jus/users/'+id), data);
  
  alert("✅ Save Done! ID: "+id);
  orgName.value=""; branchName.value=""; mob.value=""; pass.value="";
}
</script></body></html>
