<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JUS Dashboard</title>
<style>
body{margin:0;background:#f0f2f8;font-family:Arial;padding:0 0 90px 0}
.top{padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:#fff;border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card b{display:block;font-size:18px;margin-top:4px}.card span{font-size:11px;color:#555}
.formBox{margin:10px;background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
label{font-size:12px;color:#1e3a8a;font-weight:bold;margin:10px 0 4px;display:block}
input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#f3f4f6;outline:none;box-sizing:border-box}
.idRow{display:flex;gap:8px;align-items:center}.idRow input{flex:1}
.badge{background:#1e40af;color:#fff;padding:12px 18px;border-radius:12px;font-weight:bold}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#1e40af;color:#fff;font-weight:bold;margin-top:12px;font-size:15px}
.listItem{background:#fff;border-radius:14px;padding:12px;margin:8px 10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.listItem b{font-size:14px}.listItem small{color:#666;font-size:11px}
.actBtn{padding:6px 10px;border:none;border-radius:8px;font-size:12px;margin-left:4px;cursor:pointer}
.edit{background:#2563eb;color:#fff}.del{background:#ef4444;color:#fff}
.botNav{position:fixed;bottom:10px;left:10px;right:10px;background:#fff;border-radius:20px;display:flex;justify-content:space-around;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
</style></head><body>

<div class="top">
<div class="card">🏢<span>Total Org</span><b id="totalOrg">0</b></div>
<div class="card">✅<span>Active Org</span><b id="activeOrg">0</b></div>
<div class="card">🏬<span>Total Bra</span><b id="totalBra">0</b></div>
<div class="card">✔️<span>Active Bra</span><b id="activeBra">0</b></div>
<div class="card">❌<span>Reject Bra</span><b id="rejectBra">0</b></div>
<div class="card">🏪<span>Total Shop</span><b id="totalShop">0</b></div>
<div class="card">🛍️<span>Active Shop</span><b id="activeShop">0</b></div>
<div class="card">🗑️<span>Reject Shop</span><b id="rejectShop">0</b></div>
<div class="card">👥<span>All Member</span><b id="allMember">0</b></div>
<div class="card">👤<span>Active Member</span><b id="activeMember">0</b></div>
<div class="card">⬇️<span>Drop Member</span><b id="dropMember">0</b></div>
<div class="card">💰<span>Amount</span><b id="totalAmount">৳0</b></div>
</div>

<div class="formBox">
<h3>➕ Add New Organization</h3>
<label>Organization Name</label><input id="orgName" list="orgList" placeholder="Enter organization name"><datalist id="orgList"></datalist>
<label>Branch Name</label><input id="branchName" list="branchList" placeholder="Enter branch name"><datalist id="branchList"></datalist>
<label>Branch ID Auto Generate - 01</label><div class="idRow"><input id="orgUserID" readonly><div class="badge" id="branchID">01</div></div><div style="font-size:11px;color:#666" id="genText">Auto: 01</div>
<label>Branch Category</label><select id="cat"><option selected>Branch Agriculture</option><option>Branch Finance</option><option>Branch Shop</option><option>Branch Travels</option><option>Branch Others</option></select>
<label>Mobile Number</label><input id="mob" placeholder="+880 1XXX">
<label>Password</label><input id="pass" type="password" placeholder="••••">
<button class="btn" id="saveBtn" onclick="saveData()">Save Organization</button>
</div>

<div class="formBox"><h3>📋 All Organizations - এখানে Data দেখবে + Edit করবে</h3><div id="dataList">Loading...</div></div>

<div class="botNav"><span>🏠 Home</span><span>📊 Analytics</span><span style="background:#2563eb;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center">+</span><span>👤</span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyD2lEhqt_90knN7xERpQN9GZ4U_uuUnJs",authDomain:"jus-bmp-skf.firebaseapp.com",databaseURL:"https://jus-bmp-skf-default-rtdb.firebaseio.com",projectId:"jus-bmp-skf",storageBucket:"jus-bmp-skf.firebasestorage.app",messagingSenderId:"763512076096",appId:"1:763512076096:web:3e5f79cc274b34d8106ca5"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let totalCount=0, editId=null, editCat=null;

onValue(ref(db,'jus/categories'), s=>{
  const data=s.val()||{}; let total=0, active=0, reject=0, drop=0, shopTotal=0, shopActive=0, shopReject=0;
  let listHTML="", orgSet=new Set(), branchSet=new Set(), orgMap={};
  Object.entries(data).forEach(([catName, catObj])=>{
    Object.entries(catObj||{}).forEach(([id, item])=>{
      total++; const st=(item.status||'active').toLowerCase(); const catL=(item.category||catName||'').toLowerCase();
      if(st==='reject'){ reject++; if(catL.includes('shop')) shopReject++; } else if(st==='drop'){ drop++; } else { active++; if(catL.includes('shop')) shopActive++; }
      if(catL.includes('shop')) shopTotal++;
      orgSet.add(item.orgName); branchSet.add(item.branchName);
      if(!orgMap[item.orgName]) orgMap[item.orgName]=[]; if(!orgMap[item.orgName].includes(item.branchName)) orgMap[item.orgName].push(item.branchName);
      listHTML+=`<div class="listItem"><div><b>${item.orgName} - ${item.branchName}</b><br><small>ID:${id} | ${item.category} | ${item.mobile}</small></div><div><button class="actBtn edit" onclick="editData('${catName}','${id}')">Edit</button><button class="actBtn del" onclick="delData('${catName}','${id}')">Del</button></div></div>`;
    });
  });
  totalCount=total;
  totalOrg.innerText=total; activeOrg.innerText=active; totalBra.innerText=total; activeBra.innerText=active; rejectBra.innerText=reject;
  totalShop.innerText=shopTotal; activeShop.innerText=shopActive; rejectShop.innerText=shopReject;
  allMember.innerText=total; activeMember.innerText=active; dropMember.innerText=drop;
  dataList.innerHTML=listHTML||"No Data";
  orgList.innerHTML=""; orgSet.forEach(v=>{ let o=document.createElement('option'); o.value=v; orgList.appendChild(o); });
  branchList.innerHTML=""; branchSet.forEach(v=>{ let o=document.createElement('option'); o.value=v; branchList.appendChild(o); });
  if(!editId){ let nid=total+1; nid=nid<10?"0"+nid:nid+""; branchID.innerText=nid; orgUserID.value=nid; genText.innerText=`Auto: ${nid} (${total} ডেটা)`; }
  window.orgMapData=orgMap;
});

window.saveData=async()=>{
  const org=orgName.value.trim(), bra=branchName.value.trim(), catV=cat.value, mobV=mob.value.trim(), pas=pass.value.trim();
  let id=orgUserID.value.trim(); if(!org||!bra||!mobV||!pas) return alert("সব লাগবে!");
  const data={orgName:org, organizationName:org, branchName:bra, branchID:id, orgUserID:id, orgID:id, mobile:mobV, mobileNumber:mobV, password:pas, branchPassword:pas, category:catV, status:"active", createdAt:Date.now()};
  if(editId){ await set(ref(db,'jus/categories/'+editCat+'/'+editId), data); await set(ref(db,'jus/users/'+editId), data); editId=null; editCat=null; saveBtn.innerText="Save Organization"; }
  else{ await set(ref(db,'jus/categories/'+catV+'/'+id), data); await set(ref(db,'jus/users/'+id), data); }
  alert("✅ Saved! ID:"+id); orgName.value=""; branchName.value=""; mob.value=""; pass.value="";
}

window.editData=async(c,id)=>{
  const snap=await get(ref(db,'jus/categories/'+c+'/'+id)); if(!snap.exists()) return;
  const d=snap.val(); orgName.value=d.orgName; branchName.value=d.branchName; cat.value=d.category; mob.value=d.mobile; pass.value=d.password; orgUserID.value=id; branchID.innerText=id; editId=id; editCat=c; saveBtn.innerText="Update Organization"; window.scrollTo(0,0);
}
window.delData=async(c,id)=>{ if(!confirm("Delete ID "+id+"?")) return; await remove(ref(db,'jus/categories/'+c+'/'+id)); await remove(ref(db,'jus/users/'+id)); alert("Deleted!"); }

// Org select -> Branch auto
orgName.addEventListener('change', ()=>{ const sel=orgName.value; const list=window.orgMapData?.[sel]||[]; branchList.innerHTML=""; list.forEach(b=>{ let o=document.createElement('option'); o.value=b; branchList.appendChild(o); }); if(list[0]) branchName.value=list[0]; });
</script></body></html>
