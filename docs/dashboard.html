<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JUS Dashboard</title>
<style>
body{margin:0;background:#f4f5f9;font-family:Arial;padding:12px;padding-bottom:90px;}
.top-card{background:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-around;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.06);margin-bottom:15px;}
.icon-circle{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin:auto;margin-bottom:5px;}
.cat-title{font-weight:bold;margin:8px 2px 10px;font-size:15px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.cat-box{background:#fff;border-radius:16px;padding:18px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,0.05);}
.cat-box.icon-circle{width:52px;height:52px;font-size:26px;}
.add-card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,0.06);}
.add-card b{font-size:14px;}
.add-card input,.add-card select{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:none;background:#f1f2f6;outline:none;box-sizing:border-box;font-size:13px;}
.id-row{display:flex;gap:10px;}
.id-row select{flex:1.2;}
.id-row div{flex:0.8;background:#eaf0ff;border:1px solid #3b82f6;color:#2563eb;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;letter-spacing:2px;}
.save-btn{width:100%;background:#2f5bff;color:#fff;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:14px;margin-top:10px;cursor:pointer;}
#genText{color:#16a34a;font-size:12px;text-align:center;margin-top:8px;font-weight:bold;}
.bottom-nav{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;border-radius:25px;padding:12px;display:flex;justify-content:space-around;align-items:center;box-shadow:0 6px 25px rgba(0,0,0,0.1);}
.plus{width:42px;height:42px;background:#2f5bff;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;}
</style>
</head>
<body>

<div class="top-card">
<div><div class="icon-circle" style="background:#fff4d6;">💰</div>Org<br><b id="totalOrg">0</b></div>
<div><div class="icon-circle" style="background:#e6f0ff;">📦</div>Sale<br><b>৳0</b></div>
<div><div class="icon-circle" style="background:#f3e6ff;">👥</div>Due<br><b>৳0</b></div>
</div>

<div class="cat-title">Categories</div>
<div class="cat-grid">
<div class="cat-box"><div class="icon-circle" style="background:#e6f0ff;">$</div>Branch Finance <b id="c1">0</b></div>
<div class="cat-box"><div class="icon-circle" style="background:#e0f8e0;">🌱</div>Branch Agriculture <b id="c2">0</b></div>
<div class="cat-box"><div class="icon-circle" style="background:#fff1e0;">🛍️</div>Branch Shop <b id="c3">0</b></div>
<div class="cat-box"><div class="icon-circle" style="background:#e6f0ff;">✈️</div>Branch Travels <b id="c4">0</b></div>
<div class="cat-box"><div class="icon-circle" style="background:#f0f0f0;">•••</div>Branch Others <b id="c5">0</b></div>
</div>

<div class="add-card">
<b>+ Add New Organization</b>
<input id="orgName" placeholder="AFROJA AGRO" oninput="autoGenID()">
<input id="branchName" placeholder="Branch Name (ex: Rajshahi Sadar)">
<input id="branchTitle" placeholder="Branch Title (ex: Main Branch)">
<input id="mobile" placeholder="Mobile Number">
<input id="password" placeholder="Branch Login Password">
<div class="id-row">
<select id="category">
<option value="Branch Finance">Branch Finance</option>
<option value="Branch Agriculture" selected>Branch Agriculture</option>
<option value="Branch Shop">Branch Shop</option>
<option value="Branch Travels">Branch Travels</option>
<option value="Branch Others">Branch Others</option>
</select>
<div id="orgID">01</div>
</div>
<button class="save-btn" onclick="saveToFirebase()">Save to Firebase</button>
<div id="genText">✅ Auto ID: 01 (শুধু সংখ্যা)</div>
</div>

<div class="bottom-nav">
<div style="color:#2f5bff;font-weight:bold;font-size:12px;">🏠 Home</div>
<div style="font-size:12px;color:#888;">Analytics</div>
<div class="plus">+</div>
<div>🔔</div>
<div>👤</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyD2lEhqt_90knN7xERpQN9GZ4U_uuUnJs", authDomain: "jus-bmp-skf.firebaseapp.com", databaseURL: "https://jus-bmp-skf-default-rtdb.firebaseio.com", projectId: "jus-bmp-skf", storageBucket: "jus-bmp-skf.firebasestorage.app", messagingSenderId: "763512076096", appId: "1:763512076096:web:3e5f79cc274b34d8106ca5" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let totalCount=0;
onValue(ref(db,'jus/categories'), snap=>{
  const data=snap.val()||{};
  let total=0;
  let c={ "Branch Finance":0,"Branch Agriculture":0,"Branch Shop":0,"Branch Travels":0,"Branch Others":0 };
  Object.keys(data).forEach(cat=>{
    const count = Object.keys(data[cat]||{}).length;
    if(c[cat]!==undefined) c[cat]=count;
    total+=count;
  });
  totalCount=total;
  document.getElementById('totalOrg').innerText=total;
  document.getElementById('c1').innerText=c["Branch Finance"];
  document.getElementById('c2').innerText=c["Branch Agriculture"];
  document.getElementById('c3').innerText=c["Branch Shop"];
  document.getElementById('c4').innerText=c["Branch Travels"];
  document.getElementById('c5').innerText=c["Branch Others"];
  autoGenID();
});

window.autoGenID=()=>{
  let next = totalCount + 1;
  if(next<1) next=1;
  let id;
  if(next<10) id="0"+next;
  else id=String(next);
  document.getElementById('orgID').innerText=id;
  document.getElementById('genText').innerText="✅ Auto ID: "+id+" (শুধু সংখ্যা 01 থেকে)";
}

window.saveToFirebase=()=>{
  const orgName=document.getElementById('orgName').value.trim();
  const branchName=document.getElementById('branchName').value.trim();
  const branchTitle=document.getElementById('branchTitle').value.trim();
  const mobile=document.getElementById('mobile').value.trim();
  const password=document.getElementById('password').value.trim();
  const category=document.getElementById('category').value;
  const orgID=document.getElementById('orgID').innerText;
  if(!orgName||!branchName||!branchTitle||!mobile||!password) return alert("Sob Fill Koro!");
  const data={orgName,branchName,branchTitle,mobile,password,orgID,category,createdAt:Date.now()};
  set(ref(db,'jus/categories/'+category+'/'+orgID), data).then(()=>{
    alert("✅ Saved! ID: "+orgID);
    document.getElementById('orgName').value="";document.getElementById('branchName').value="";document.getElementById('branchTitle').value="";document.getElementById('mobile').value="";document.getElementById('password').value="";
  });
}
</script>
</body></html>
