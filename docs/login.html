.card{width:90%; max-width:360px; background:rgba(255,255,255,0.07); border:1px solid rgba(0,200,255,0.3); border-radius:20px; padding:30px; backdrop-filter:blur(10px); text-align:center; box-shadow:0 0 30px rgba(0,180,255,0.2);}
